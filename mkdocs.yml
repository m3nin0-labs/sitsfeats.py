site_name: sitsfeats.py
site_description: Python package for extracting metrics from satellite image time series
repo_url: https://github.com/m3nin0-labs/sitsfeats.py
repo_name: m3nin0-labs/sitsfeats.py

theme:
  name: material
  
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Data cubes (xarray): xarray.md
  - Metrics catalogue: metrics.md
  - API reference: api.md

markdown_extensions:
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: google

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
